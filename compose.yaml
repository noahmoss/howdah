name: howdah-test

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: howdah
      POSTGRES_PASSWORD: howdah
      POSTGRES_DB: howdah_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "howdah", "-d", "howdah_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
